name: Docker image

# Builds the image for amd64, arm64 and armv7 (32- and 64-bit Raspberry Pi) and publishes
# it to the GitHub Container Registry, but only if the tests pass.
#   push to master  ->  ghcr.io/<owner>/<repo>:latest and :sha-<commit>
#   tag v1.2.3      ->  :1.2.3 and :1.2
on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore: ["**.md", ".gitignore", "LICENSE", "install/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests -v
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --test tests/test_calculator.js

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # lets this job's GITHUB_TOKEN publish to GHCR
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
