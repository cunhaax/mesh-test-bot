# The bot's own default settings, and what each one does. Loaded automatically --
# don't edit this file. To change something, put it instead in your own bot.ini (or
# data/bot.ini with Docker), as an environment variable MTBOT_<NAME>, or as a flag.
# Precedence: flags > environment > bot.ini > this file.
[bot]
# Meshtastic radio (WiFi): the IP is preferred. Inside Docker the .local name (mDNS)
# usually does not resolve.
host = meshtastic.local
# TCP port (4403 is Meshtastic's). Only change it if you're connecting to another
# service that speaks the same TCP protocol instead of the radio.
port = 4403

# Index of the channel used to send and listen (as shown in the app, starting at 0).
# REQUIRED -- e.g. channel = 1. Use a test channel, not one shared by many people.
channel =
# Expected name at that index: if it does not match, the session is aborted, so it
# never transmits on the wrong channel. Recommended. Empty = do not check.
channel_name =

# Where you are (city level). REQUIRED -- e.g. place = Lisbon. Goes in every message.
place =

# The bot's messages look like this (max 200 bytes, no '|' in the place):
#     MTBOT | ABCD | City | 2/3
#     prefix, the station's own short name, place, "n of total"
# The prefix (`keyword`) tells the bot's messages apart from regular chat. It can be
# several words (e.g. "FIELD TEST ALPHA"): matching ignores case and any punctuation or
# spacing between the words, so "field, test alpha" or "fieldtest alpha" also count.
# Whoever wants to hear your messages has to configure the same prefix. Cannot be empty
# or contain '|' (used as a field separator).
keyword = MTBOT
# A short prefix repeated at the start of every line in the readable report (report.txt),
# so each line reads on its own and can be pasted elsewhere, e.g.:
#     ACK | ABCD | 2 | City | RF
# Unrelated to `keyword` above (which tags messages on the radio channel) -- this one
# only affects the text report's own formatting. Cannot be empty.
report_prefix = ACK
# The LoRa mode (LONG_FAST, NARROW_FAST...) is read from the radio's own configuration
# and shown in the report header and JSON, but is no longer part of the message text.
# Only fill this in to force a label instead of reading it from the radio.
mode =
# Names for manual LoRa settings (bandwidth, SF, CR), as BW<kHz>-SF<n>-CR<n>=NAME,
# comma-separated. A preset (LONG_FAST, NARROW_FAST...) always uses the preset's name.
mode_aliases = BW62-SF7-CR6=NARROW_FAST

# Number of messages per session. They go out at RANDOM moments, so that everyone running
# this bot does not transmit at once: the emission window is split into `message_count`
# equal parts and each message falls at a random moment of its own part, never closer than
# 2 minutes to the next one.
message_count = 3

# Limits, so that a network of many participants is not flooded: `message_count` at most
# 10, `listen_minutes` (the emission and listening window) at least 30, and
# `report_window_minutes` (below) at least 10. `--unsafe-limits` on the command line (never
# in this file) lifts the first two and the 2-minute gap, for a private-channel load test;
# the report-window floor stays.

# The report comes out at a random moment in the N minutes after the emission window
# ends. The bot keeps listening until then, so a large mesh has time to finish
# propagating stragglers before the report is written.
report_window_minutes = 60

# When: day of the week (monday..sunday, or "daily" for every day) and start time.
# The time is read in the "timezone" zone, whatever the machine's own zone is: someone
# in another zone (the Azores, say) keeps the same time and the same zone, and the bot
# converts. Handles daylight saving.
weekday = saturday
start_time = 06:00
timezone = Europe/Lisbon
# Length of the emission and listening window, from the start time.
listen_minutes = 120

# Files (relative to bot.ini's folder). The report comes out in two: readable text,
# fields separated by " | ", and JSON (one line per session, the same object that can
# later go to a server).
report_file = report.txt
report_json_file = report.jsonl
rx_file = rx.log
