# Copy this file to bot.ini (or data/bot.ini with Docker) and adjust it.
# bot.ini and the data/ folder are ignored by git.
# Any option can also come from an environment variable MTBOT_<NAME> (e.g.
# MTBOT_PLACE=Porto) or a flag (--place Porto): flags win over variables, which win
# over this file. With enough environment variables, this file is not even needed.
[bot]
# Meshtastic radio (WiFi): the IP is preferred. Inside Docker the .local name (mDNS)
# usually does not resolve.
host = 192.168.1.50
# TCP port (4403 is Meshtastic's). Only change it if you're connecting to another
# service that speaks the same TCP protocol instead of the radio.
port = 4403

# Index of the channel used to send and listen (as shown in the app, starting at 0).
# REQUIRED. Use a test channel, not one shared by many people.
channel = 1
# Expected name at that index: if it does not match, the session is aborted, so it
# never transmits on the wrong channel. Recommended. Empty = do not check.
channel_name = TestChannel

# Where you are (city level). REQUIRED. Goes in every message.
place = City

# The bot's messages look like this (max 200 bytes, no '|' in the place):
#     MTBOT NARROW_FAST | City | 2/3
#     keyword, the radio's LoRa mode, place, "n of total"
# The keyword tells the bot's messages apart from regular chat. You can change it;
# whoever wants to hear your messages has to use the same one.
keyword = MTBOT
# The mode (LONG_FAST, NARROW_FAST...) is read from the radio's own LoRa configuration,
# so it is never wrong by accident. Only fill this in to force it.
mode =
# Names for manual LoRa settings (bandwidth, SF, CR), as BW<kHz>-SF<n>-CR<n>=NAME,
# comma-separated. A preset (LONG_FAST, NARROW_FAST...) always uses the preset's name.
mode_aliases = BW62-SF7-CR6=NARROW_FAST

# Number of messages per session. By default they go out at RANDOM moments, so that
# everyone running this bot does not transmit at once: the emission window is split
# into `count` equal parts and each message falls at a random moment of its own part.
count = 3
random_schedule = true
# Never two of our messages closer than this (seconds).
min_gap_seconds = 60
# LoRa has no real collision avoidance, so with random_schedule (many stations sharing
# a window) `count` above 5 or `listen_minutes` (below) under 120 is refused: see the
# README's "Random-schedule limits". Both are exempt with random_schedule = false
# (--fixed-schedule), meant for a single operator's own controlled testing.
# The radio keeps recent messages while nobody is connected to it and hands them over
# when the bot connects. The ones the radio received before the session started (plus
# this slack, in seconds) are discarded from the report and kept in rx.log as
# "before-session".
session_tolerance_seconds = 60
# The report comes out at a random moment in the N minutes after the emission window
# ends. The bot keeps listening until then.
report_window_minutes = 30
# Only with random_schedule = false: minutes between messages (and the report comes
# out right at the end of the window, with report_window_minutes = 0). Same as the
# --fixed-schedule flag.
interval_minutes = 5

# When: day of the week (monday..sunday, or "daily" for every day) and start time.
# The time is read in the "timezone" zone, whatever the machine's own zone is: someone
# in another zone (the Azores, say) keeps the same time and the same zone, and the bot
# converts. Handles daylight saving.
weekday = saturday
start_time = 21:00
timezone = Europe/Lisbon
# Length of the emission and listening window, from the start time.
listen_minutes = 120
# In --schedule mode, wake up this many minutes early to check the radio.
wake_before_minutes = 2

# Files (relative to this file's folder). The report comes out in two: readable text,
# fields separated by " | ", and JSON (one line per session, the same object that can
# later go to a server).
report_file = report.txt
report_json_file = report.jsonl
rx_file = rx.log
