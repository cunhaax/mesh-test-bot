# mesh-test-bot next to MeshMonitor: MeshMonitor keeps the connection to the radio
# (which only accepts one TCP client) and the bot connects to its Virtual Node.
# Full guide: docs/meshmonitor.md
#
# Configuration lives in the .env file next to this one (see meshmonitor.env.example).
#
#   1. docker compose -f with-meshmonitor.yml up -d
#   2. Open http://localhost:8080 (admin / changeme), change the password and enable the
#      Virtual Node on the source (the guide says how).
#
# At startup the bot briefly connects to check the radio is reachable, retrying for a few
# minutes and then exiting (so it restarts under "restart: unless-stopped") if it never
# can -- which is what happens on every restart before step 2 is done. "restart:
# unless-stopped" recovers on its own, within a few minutes, once the Virtual Node is
# enabled -- no manual restart or service ordering required.
services:
  meshmonitor:
    image: ghcr.io/yeraze/meshmonitor:latest      # tested with 4.16.1
    container_name: meshmonitor
    restart: unless-stopped
    # Cap Docker's own copy of the console output (otherwise it grows forever).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    ports:
      # The web UI, on every network interface of this machine (your LAN included). Change the
      # default password (admin / changeme) before anyone else can reach it.
      - "8080:3001"
      # do NOT publish 4404 (the Virtual Node): it has no authentication. The bot reaches
      # it over Docker's internal network, by the name "meshmonitor".
    volumes:
      - meshmonitor-data:/data

  bot:
    image: ghcr.io/cunhaax/mesh-test-bot:latest
    container_name: mesh-test-bot
    restart: unless-stopped
    # Cap Docker's own copy of the console output (otherwise it grows forever).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - meshmonitor
    env_file: .env
    volumes:
      - ./data:/data                   # reports and rx.log land here

volumes:
  meshmonitor-data:
