# mesh-test-bot: install without git. This file + an ".env" file next to it.
#
#   docker compose up -d                      start it (and again on boot)
#   docker compose logs -f --no-log-prefix    see what it's doing
#   docker compose pull && docker compose up -d   update
#   docker compose down                       stop it
#
# Configuration lives in the .env file (see env.example). Reports and rx.log are
# written to the data/ folder next to this file.
services:
  bot:
    # To avoid surprises on updates, you can pin a version: ...:1  or  ...:1.0.0
    image: ghcr.io/cunhaax/mesh-test-bot:latest
    container_name: mesh-test-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
